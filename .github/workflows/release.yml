name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "v1-cargo-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install dependencies
        run: pnpm install

      - name: Update Rust dependencies to match NPM versions
        run: |
          cd src-tauri
          cargo update -p tauri-plugin-dialog -p tauri-plugin-log

      - name: Verify frontend build
        run: |
          pnpm run build
          if (!(Test-Path "dist/index.html")) { 
            Write-Error "Build falhou: dist/index.html não encontrado"
            exit 1 
          }
          Write-Host "Build do frontend concluído com sucesso!"

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Banco de Questões v__VERSION__"
          releaseBody: "Ver changelog para detalhes"
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc